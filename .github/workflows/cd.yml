name: CD

# Builds the Windows installer.
# - Pushing a version tag (v0.1.0) attaches it to a draft release, to check and publish by hand.
# - Running it by hand (Actions > CD > Run workflow) keeps it in the run's artifacts, no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create the draft release

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.argv[1];
            const wanted = tag.replace(/^v/, "");
            const versions = {
              "package.json": JSON.parse(fs.readFileSync("package.json", "utf8")).version,
              "src-tauri/tauri.conf.json": JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version,
              "src-tauri/Cargo.toml": fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version\s*=\s*"(.+)"/m)[1],
            };
            const wrong = Object.entries(versions).filter(([, v]) => v !== wanted);
            if (wrong.length > 0) {
              const list = wrong.map(([file, v]) => `${file} tem ${v}`).join(", ");
              console.log(`::error::A tag ${tag} não bate com a versão do app: ${list}. Ajuste a versão para ${wanted} ou crie a tag certa.`);
              process.exit(1);
            }
            console.log(`Versão ${wanted} confere nos três arquivos.`);
          ' "$GITHUB_REF_NAME"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test

      - name: Read the release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          {
            echo 'body<<END_OF_NOTES'
            node scripts/release-notes.mjs "$version"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build the installer (and the draft release, for a tag)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty when run by hand: then it only builds, without a release.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Tambor de Notas ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      # The .pdb (debug symbols) is what reads a crash dump of this exact .exe. It never goes into
      # the installer: it is kept here and, for a tag, attached to the release.
      - name: Check that the .pdb matches the .exe
        run: node scripts/pdb-match.mjs src-tauri/target/release/tambor-de-notas.exe src-tauri/target/release/tambor_de_notas.pdb

      - name: Keep the .pdb in the run's artifacts
        uses: actions/upload-artifact@v7
        with:
          name: simbolos-pdb
          path: |
            src-tauri/target/release/tambor-de-notas.exe
            src-tauri/target/release/tambor_de_notas.pdb
          if-no-files-found: error
          retention-days: 90

      - name: Attach the .pdb to the draft release (tag)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/tambor_de_notas.pdb

      - name: Keep the installer in the run's artifacts (run by hand)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: instalador-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
