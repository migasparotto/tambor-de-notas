# Turns on auto-merge for the Dependabot PRs of the "-auto" groups (see dependabot.yml).
# GitHub then merges the PR by itself once the checks required by the main ruleset pass.
# It never checks out or runs the PR code: it only reads the metadata and calls the GitHub API.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Turn on auto-merge (only "-auto" groups, never a major)
        if: endsWith(steps.meta.outputs.dependency-group, '-auto') && steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
