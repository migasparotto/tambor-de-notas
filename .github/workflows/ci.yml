name: CI

on:
  push:
  pull_request:
  # A merge done by GitHub's own token (the Dependabot auto-merge) does not start the CI on main,
  # so main is checked once a week, after the Dependabot updates (Tuesday 09:00 UTC).
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:
    inputs:
      page_heap:
        description: "Run the e2e with full page heap on tambor-de-notas.exe (stops at a bad memory write)"
        type: boolean
        default: false
      e2e_args:
        description: "Extra arguments for WebdriverIO (e.g. a spec that does not exist, to check that a failure keeps its evidence)"
        type: string
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Keep the output of the tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-ubuntu
          path: |
            test-output/
            build-output/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run e2e:build

      # If the app crashes, Windows writes a full dump here; a failed run keeps it (e2e/run.mjs,
      # with scripts/windows/collect-evidence.ps1) together with the .pdb of this same build.
      - name: Turn on crash dumps of the app
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP "dumps"
          New-Item -ItemType Directory -Path $dumps -Force | Out-Null
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\tambor-de-notas.exe"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumps -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
          "TAMBOR_DUMPS=$dumps" >> $env:GITHUB_ENV

      # Full page heap: every allocation gets a guard page, so a bad memory write crashes the app
      # at the very spot, and the dump shows who did it. Only when asked, until its cost is measured.
      - name: Turn on page heap for the app
        if: inputs.page_heap
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\tambor-de-notas.exe"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name GlobalFlag -PropertyType DWord -Value 0x02000000 -Force | Out-Null
          New-ItemProperty -Path $key -Name PageHeapFlags -PropertyType DWord -Value 3 -Force | Out-Null

      - name: Run the e2e tests
        shell: pwsh
        env:
          E2E_ARGS: ${{ inputs.e2e_args }}
        run: node e2e/run.mjs $env:E2E_ARGS
      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: e2e/failures/
          if-no-files-found: ignore
          retention-days: 14

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The disk tests must also run on Windows: it refuses file names that Linux accepts.
      - run: npm ci
      - run: npm test

      # The Tauri compile needs the built interface (../dist).
      - run: npm run build

      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo check --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - name: Keep the output of the tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-windows
          path: |
            test-output/
            build-output/
          if-no-files-found: ignore
          retention-days: 14

  # Builds the Windows installer (NSIS) without publishing anything: on every Dependabot PR, so an
  # update that breaks the build is caught before the auto-merge, and on the weekly run on main
  # (the weekly CD). Skipped on other PRs, which GitHub counts as passing for a required check.
  instalador:
    if: github.actor == 'dependabot[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - name: Check that the .pdb matches the .exe
        run: node scripts/pdb-match.mjs src-tauri/target/release/tambor-de-notas.exe src-tauri/target/release/tambor_de_notas.pdb
      - name: Keep the installer in the run's artifacts
        uses: actions/upload-artifact@v7
        with:
          name: instalador-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  # Weekly: fails if the settings the Dependabot auto-merge depends on have changed (auto-merge
  # allowed in the repository; main requires the check, rust and e2e checks).
  configuracao:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check auto-merge and the checks required on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auto=$(gh api "repos/$GITHUB_REPOSITORY" --jq .allow_auto_merge)
          checks=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | sort | join(",")')
          echo "allow_auto_merge=$auto; checks exigidos na main: $checks"
          fail=0
          if [ "$auto" != "true" ]; then echo "::error::O auto-merge está desligado no repositório (Settings > General > Allow auto-merge)."; fail=1; fi
          for c in check e2e rust; do
            case ",$checks," in *",$c,"*) ;; *) echo "::error::A main não exige mais o check $c (ruleset)."; fail=1 ;; esac
          done
          exit $fail
