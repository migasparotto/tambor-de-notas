name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Keep the output of the tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-ubuntu
          path: test-output/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run e2e
      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: e2e/failures/
          if-no-files-found: ignore
          retention-days: 14

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The disk tests must also run on Windows: it refuses file names that Linux accepts.
      - run: npm ci
      - run: npm test

      # The Tauri compile needs the built interface (../dist).
      - run: npm run build

      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo check --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - name: Keep the output of the tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-windows
          path: test-output/
          if-no-files-found: ignore
          retention-days: 14
